# Frogdash: keep the system log across restarts, so what happened before a shutdown, a
# crash or a restart loop can still be read afterwards, and goes up with the report after
# the next update (tools/frogdash_upload.py). Bounded so it never fills the SD card.
# Installed by tools/frogdash_setup.sh as /etc/systemd/journald.conf.d/frogdash.conf.
[Journal]
Storage=persistent
SystemMaxUse=150M
SystemKeepFree=1G
MaxRetentionSec=1month
