# Installed by tools/frogdash_setup.sh at /etc/systemd/system/frogdash.service.d/terminal.conf
# while --terminal is in /etc/default/frogdash: lets the dash reach the Terminal helper
# (frogdash-terminal.socket), which runs commands as the screen user so sudo works.
[Service]
SupplementaryGroups=frogdash-terminal
