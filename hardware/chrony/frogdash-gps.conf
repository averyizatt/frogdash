# Set the Pi's clock from the USB GPS (via gpsd's shared-memory feed), so the dash
# shows the right time with no internet. Install:
#   sudo apt install -y chrony
#   sudo cp hardware/chrony/frogdash-gps.conf /etc/chrony/conf.d/
#   sudo systemctl restart chrony
# USB GPS time is accurate to about 0.1-0.2 s, plenty for a clock.
refclock SHM 0 refid GPS precision 1e-1 offset 0.2 delay 0.2 poll 3 trust require
# Jump straight to GPS time whenever it is far off (the Pi has no battery clock).
makestep 1 -1
