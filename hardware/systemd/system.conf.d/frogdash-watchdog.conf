# Pi 4 hardware watchdog: systemd pets it every RuntimeWatchdogSec/2. If the whole system
# hangs (kernel, SD card, power brownout), the chip reboots the Pi on its own.
# Install: sudo cp hardware/systemd/system.conf.d/frogdash-watchdog.conf /etc/systemd/system.conf.d/
#          sudo systemctl daemon-reexec
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
