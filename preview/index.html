<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Frogdash · Simulated design preview</title>
  <!-- Generated by tools/update_preview.py. The preview at the car screen's own size: the dash
       (dash.html) runs in a 1920 x 720 frame scaled to fit this window, so it lays out exactly
       as on the car's 1920 x 720 display, whatever the window. dash.html on its own fits any
       window, as the dash does in a phone or laptop browser. -->
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    #screen { position:absolute; left:50%; top:50%; width:1920px; height:720px; border:0; display:block;
              transform:translate(-50%, -50%) scale(var(--fit, .5)); background:#000; }
    #turn { display:none; position:absolute; left:0; right:0; bottom:24px; margin:0; text-align:center;
            font:600 15px "Segoe UI", Arial, sans-serif; color:#8fa3ad; }
    @media (orientation: portrait) { #turn { display:block; } }
  </style>
</head>
<body>
  <iframe id="screen" title="Frogdash driver display, 1920 x 720"></iframe>
  <p id="turn">Turn your phone sideways for a bigger view.</p>
  <script>
    const screenFrame = document.getElementById('screen');
    const fit = () => document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 720));
    addEventListener('resize', fit); fit();
    screenFrame.onload = () => screenFrame.contentWindow.focus();     // Keys go to the dash
    screenFrame.src = 'dash.html' + location.search + location.hash;
  </script>
</body>
</html>
