name: CAN and GPS tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: g++ --version
      - run: python -m unittest discover -s tests -v
      - run: python tools/update_preview.py --check
      - run: pip install -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_layout.py
      - run: python tests/browser_personalize.py
      - run: python tests/browser_instruments.py
      - run: python tests/browser_camera.py
      - run: python tests/browser_first_paint.py
      - run: python tests/browser_wheel_tools.py
      - run: python tests/browser_taillights.py
      - run: python tests/browser_driving.py
      - run: python tests/browser_trip.py
      - run: python tests/browser_operations.py
      - run: python tests/browser_audio.py
      - run: python tests/browser_navigation.py
      - run: python tests/browser_demo.py
      - run: python tests/browser_power.py
      - run: python tests/browser_interactions.py
