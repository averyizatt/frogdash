name: CAN and GPS tests
on:
  push:
    # The Pi's uploads (tools/frogdash_upload.py) are data, not code.
    branches-ignore: [pi-logs]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-tools.lock
      - run: g++ --version
      # An undefined name only fails when its line runs: on the Pi, at start-up (os in
      # server.py's main(), October 2026). Caught here before it can be installed.
      - run: pip install pyflakes==3.2.0 && python -m pyflakes hardware/frogdash tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/update_preview.py --check
      - run: pip install -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_layout.py
      - run: python tests/browser_personalize.py
      - run: python tests/browser_instruments.py
      - run: python tests/browser_camera.py
      - run: python tests/browser_first_paint.py
      - run: python tests/browser_wheel_tools.py
      - run: python tests/browser_taillights.py
      - run: python tests/browser_driving.py
      - run: python tests/browser_trip.py
      - run: python tests/browser_operations.py
      - run: python tests/browser_audio.py
      - run: python tests/browser_navigation.py
      - run: python tests/browser_demo.py
      - run: python tests/browser_power.py
      - run: python tests/browser_interactions.py
      - run: python tests/browser_knock.py
      - run: python tests/browser_screen.py
      - run: python tests/browser_software.py
      - run: python tests/browser_keyboard.py
      - run: python tests/browser_camera_view.py
      - run: python tests/browser_summary.py
      - run: python tests/browser_firmware.py
      - run: python tests/browser_graphs.py
